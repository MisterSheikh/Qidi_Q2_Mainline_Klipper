# Qidi Q2 mainline Klipper compatibility reference
#
# This is not a complete or directly includable printer profile. It lists the
# changes from the stock Qidi configuration and the older mainline examples.
# Merge these keys into the active configuration. Preserve machine-specific
# motion, heater, driver, PID, and extrusion tuning.

##### MCU connections #####
# Stock Qidi loads the mainboard definition from MCU_ID.cfg. Define [mcu] in
# exactly one active file and use the serial path reported by this printer.
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_<actual-id>-if00
restart_method: command

[mcu THR]
serial: /dev/ttyS4
restart_method: command
baud: 500000

##### Native load-cell Z endstop #####
# Remove these stock Qidi-only options from [stepper_z]:
#   endstop_pin_reverse
#   position_endstop_reverse
#   homing_positive_dir_reverse
# Also remove endstop_pin_reverse from [stepper_z1].
[stepper_z]
endstop_pin: probe:z_virtual_endstop
homing_speed: 10
second_homing_speed: 5
homing_retract_dist: 5
homing_positive_dir: false

##### MAX6675 on Q2 hardware SPI2 #####
# Stock Qidi uses "spi_bus: spi2". Older mainline examples used software-SPI
# pins. Replace either form with this explicit Q2 mapping and remove any
# spi_software_* keys from the active [extruder] section.
[extruder]
sensor_type: MAX6675
sensor_pin: THR:PB12
spi_bus: spi2_PB14_PC0_PB13
spi_speed: 2000000

##### Stock Qidi-only chamber option to remove #####
# Remove "z_max_limit" from [heater_generic chamber]. Mainline Klipper does
# not support that option.

##### Load-cell probe (replaces the stock probe_air section) #####
# Remove the complete stock [probe_air] section, including c_sensor, voltage,
# delta_v, and its probe z_offset. Define [load_cell_probe] exactly once.
[load_cell_probe]
sensor_type: cs1237
sclk_pin: THR:PB3
dout_pin: THR:PB4
sample_rate: 1280
gain: 128
channel: A
refout_off: False
sensor_orientation: normal
# The nozzle is the probe. Keep the separately saved first-layer adjustment
# out of this value.
z_offset: 0
speed: 5
lift_speed: 5
samples: 2
sample_retract_dist: 3
samples_result: average
samples_tolerance: 0.02
samples_tolerance_retries: 10
trigger_force: 75
force_safety_limit: 2000
