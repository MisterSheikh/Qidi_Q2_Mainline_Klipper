# Qidi Q2 mainline Klipper macro reference
#
# These macros are optional migration fragments, not a complete macro pack.
# save_zoffset/set_zoffset require an existing [save_variables] section.
# Adapt the calls in your own homing and print macros. Review every file in the
# stock include graph; do not leave calls to omitted Qidi extensions such as
# BUFFER_MONITORING, DISABLE_BOX_HEATER, CLEAR_LAST_FILE, or box_extras.
# The complete adapted example is in personal_config_reference/gcode_macro.cfg.

[gcode_macro save_zoffset]
gcode:
    {% if printer.gcode_move.homing_origin.z < 0.5 %}
       SAVE_VARIABLE VARIABLE=z_offset VALUE={printer.gcode_move.homing_origin.z}
    {% endif %}

[gcode_macro set_zoffset]
gcode:
    {% set z = printer.save_variables.variables.z_offset|default(0) %}
    SET_GCODE_OFFSET Z={z} MOVE=0

[gcode_macro _HOME_Z]
gcode:
    SET_GCODE_OFFSET Z=0 MOVE=0
    G28 Z
    G91
    G1 Z10 F600
    G90

# Retain the stock _HOME_X, _HOME_Y, _HOME_XY, and PRINTER_PARAM macros.
[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_x = home_all or 'X' in params %}
    {% set home_y = home_all or 'Y' in params %}
    {% set home_z = home_all or 'Z' in params %}
    {% set xy_unhomed = 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
    {% set need_xy_for_z = home_z and not home_all and xy_unhomed %}

    M204 S10000
    M220 S100
    SET_STEPPER_ENABLE STEPPER=extruder enable=0

    {% if home_all %}
        SET_KINEMATIC_POSITION X=100 Y=100 Z={printer.toolhead.axis_maximum.z / 2}
        G91
        G1 Z5 F600
        G4 P500
        _HOME_XY
    {% elif need_xy_for_z or (home_x and home_y) %}
        _HOME_XY
    {% elif home_x %}
        _HOME_X
    {% elif home_y %}
        _HOME_Y
    {% endif %}

    {% if home_z %}
        G90
        G1 X{printer['gcode_macro PRINTER_PARAM'].max_x_position / 2} Y{printer['gcode_macro PRINTER_PARAM'].max_y_position / 2} F7800
        M400
        _HOME_Z
    {% endif %}

    M204 S10000
    G90
